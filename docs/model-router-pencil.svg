    <!-- Measurement services. -->
    <path class="hex" d="M1518 212 L1573 212 L1601 260 L1573 308 L1518 308 L1490 260 Z"/>
    <path class="echo" d="M1516 209 L1576 210 L1604 260 L1575 311 L1516 311 L1487 260 Z"/>
    <use href="#receipt" x="1502" y="216" width="87" height="87"/>
    <text x="1545" y="342">Route receipt</text>
    <text class="small" x="1545" y="368">Alias → Astra</text>

    <path class="future-hex" d="M1518 602 L1573 602 L1601 650 L1573 698 L1518 698 L1490 650 Z"/>
    <use href="#chart" x="1502" y="607" width="87" height="87"/>
    <text class="blue" x="1545" y="733">Usage + latency</text>
    <text class="small" x="1545" y="761">Allowance / savings</text>
    <text class="tiny" x="1545" y="787">vs. always-top</text>

    <!-- Compact canvas-only legend; short enough to read at README scale. -->
    <path class="flow" d="M36 1036 L88 1036"/>
    <text class="small" text-anchor="start" style="text-anchor:start" x="102" y="1042">Working now</text>
    <path class="next" d="M273 1036 L325 1036"/>
    <text class="small blue" style="text-anchor:start" x="339" y="1042">Planned next</text>
    <text class="small" x="1126" y="1042">Existing provider connections. No silent paid-API fallback.</text>
  </g>
