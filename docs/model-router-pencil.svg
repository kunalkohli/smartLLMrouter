    <path class="echo" d="M825 209 L885 210 L913 260 L884 311 L825 311 L796 260 Z"/>
    <use href="#brain" x="810" y="216" width="89" height="89"/>
    <text x="855" y="342">Astra planner</text>
    <text class="small" x="855" y="368">Reason + make a plan</text>
    <path class="future-hex" d="M827 468 L882 468 L910 516 L882 564 L827 564 L799 516 Z"/>
    <use href="#document" x="811" y="472" width="88" height="88"/>
    <text class="blue" x="855" y="599">Plan digest</text>

    <!-- Current Build stays Astra. Planned tiers are a nested service boundary. -->
    <path class="hex" d="M1173 212 L1228 212 L1256 260 L1228 308 L1173 308 L1145 260 Z"/>
    <path class="echo" d="M1171 209 L1231 210 L1259 260 L1230 311 L1171 311 L1142 260 Z"/>
    <use href="#tools" x="1157" y="217" width="87" height="87"/>
    <text x="1200" y="342">Astra executor</text>
