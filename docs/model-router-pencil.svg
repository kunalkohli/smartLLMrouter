    <path class="future-hex" d="M1270 510 L1315 510 L1338 549 L1315 588 L1270 588 L1247 549 Z"/>
    <use href="#blocks" x="1258" y="516" width="68" height="68"/>
    <text x="1293" y="621">Mid</text>
    <text class="tiny" x="1293" y="645">feature work</text>

    <path class="future-hex" d="M1177 654 L1222 654 L1245 693 L1222 732 L1177 732 L1154 693 Z"/>
    <use href="#brain" x="1165" y="659" width="70" height="70"/>
